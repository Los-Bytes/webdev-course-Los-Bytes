<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página de Perfil</title>
    <style>
        /* Aquí debes agregar los estilos CSS para la página. 
           Personaliza los colores, márgenes y otros estilos según sea necesario. */
    </style>
</head>
<body>

    <!-- Añadir un encabezado (<header>) con un título (<h1>) que describa el propósito de la página. -->

    <div class="profile">
        <!-- Insertar una imagen de perfil con la etiqueta <img>. Usa una URL válida para la imagen. -->

        <div class="bio">
            <!-- Crear un título de segundo nivel (<h2>) con tu nombre. -->
            <!-- Escribe un párrafo (<p>) con una breve descripción personal. -->

            <div class="social-links">
                <!-- Aquí debes agregar enlaces (<a>) a tus redes sociales. Asegúrate de agregar el atributo "href" con la URL correcta. -->
            </div>
        </div>
    </div>

</body>
</html>
