<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 1em;
        }

        img {
            width: 150px;
            border-radius: 50%;
            margin-top: 20px;
        }

        .profile-info {
            text-align: center;
            margin-top: 20px;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <h1>Mi Perfil</h1>
    </header>

    <div class="profile-info">
        <img src="https://via.placeholder.com/150" alt="Foto de perfil">
        <h1>Juan Pérez</h1>
        <p>Estudiante de desarrollo web. Me encanta la tecnología y aprender cosas nuevas.</p>
    </div>
</body>
</html>
