<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página de Perfil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaeaea;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #3498db;
            color: white;
            text-align: center;
            padding: 1em;
        }

        .profile {
            text-align: center;
            margin-top: 50px;
        }

        img {
            width: 150px;
            border-radius: 50%;
        }

        .bio {
            background-color: #fff;
            margin: 20px auto;
            padding: 20px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .bio h2 {
            color: #333;
        }

        .bio p {
            color: #555;
        }

        .social-links a {
            margin: 10px;
            text-decoration: none;
            color: #3498db;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mi Página de Perfil</h1>
    </header>

    <div class="profile">
        <img src="https://via.placeholder.com/150" alt="Foto de perfil">
        <div class="bio">
            <h2>Juan Pérez</h2>
            <p>Soy un estudiante apasionado por la programación. Me encanta aprender y mejorar cada día.</p>
            <div class="social-links">
                <a href="https://www.facebook.com" target="_blank">Facebook</a>
                <a href="https://www.twitter.com" target="_blank">Twitter</a>
                <a href="https://www.linkedin.com" target="_blank">LinkedIn</a>
            </div>
        </div>
    </div>

</body>
</html>
